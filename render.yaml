# Config Render — déploie l'app complète (front + API) en un clic depuis GitHub
# Une seule adresse https://...onrender.com sert l'app ET l'API.
services:
  - type: web
    name: fidelity-api
    runtime: node
    rootDir: backend
    plan: free
    # Compile d'abord l'app React (app/dist), puis l'API qui la sert
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: DATABASE_URL
        sync: false # à remplir dans le dashboard Render
      - key: APP_SECRET
        sync: false # à remplir dans le dashboard Render
      - key: ALLOWED_ORIGINS
        sync: false # optionnel : l'app est servie par l'API (même origine)
